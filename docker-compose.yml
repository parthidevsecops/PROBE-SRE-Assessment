services:
  probe-neo4j:
    image: neo4j:latest
    container_name: probe-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - probe_neo4j_data:/data
      - probe_neo4j_logs:/logs
    networks: [kg-network]
    restart: unless-stopped

  probe-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: probe-processor:6.0
    container_name: probe-app
    depends_on:
      - probe-neo4j
    ports:
      - "8501:8501"
    environment:
      NEO4J_URI: bolt://probe-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      HF_TOKEN: ${HF_TOKEN}
      HF_BASE_URL: https://api.openai.com/v1
      HF_MODEL: gpt-6-luna
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      INPUT_PATH: /app/input
      CHROMA_PATH: /app/chroma_db
      GRAPH_PATH: /app/graph_db/probe_graph.json
      INGEST_STATUS_FILE: /app/data/ingest_status.json
      LLM_PROVIDER_1_TOKEN: ${LLM_PROVIDER_1_TOKEN}
      LLM_PROVIDER_1_URL: ${LLM_PROVIDER_1_URL}
      LLM_PROVIDER_1_MODEL: ${LLM_PROVIDER_1_MODEL}
      HF_USE_LOCAL: ${HF_USE_LOCAL:-false}
    volumes:
      - ./input:/app/input:ro
      - probe_chroma:/app/chroma_db
    networks: [kg-network]
    restart: unless-stopped
    env_file:
      - .env

volumes:
  probe_neo4j_data:
  probe_neo4j_logs:
  probe_chroma:
networks:
  kg-network:
    external: true
